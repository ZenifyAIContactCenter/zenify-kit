version: 2
project_name: zenify
before:
  hooks:
    - go mod tidy
builds:
  - id: zenify
    main: ./cmd/zenify
    binary: zenify
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ZenifyAIContactCenter/zenify-kit/internal/version.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - id: zenify
    name_template: "zenify_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
# The public zenify-kit repo doubles as its own Homebrew tap and Scoop bucket:
# GoReleaser commits Casks/zenify.rb and the Scoop manifest here on each release,
# and the release assets are public, so brew/scoop download them with no auth.
homebrew_casks:
  - repository:
      owner: ZenifyAIContactCenter
      name: zenify-kit
    name: zenify
    homepage: https://github.com/ZenifyAIContactCenter/zenify-kit
    description: Portable zenify workspace toolkit
    skip_upload: auto
scoops:
  - repository:
      owner: ZenifyAIContactCenter
      name: zenify-kit
    name: zenify
    skip_upload: auto

version: 2
project_name: zenify
before:
  hooks:
    - go mod tidy
builds:
  - id: zenify
    main: ./cmd/zenify
    binary: zenify
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/ZenifyAIContactCenter/zenify-kit/internal/version.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - id: zenify
    name_template: "zenify_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - repository:
      owner: ZenifyAIContactCenter
      name: homebrew-tap
    name: zenify
    homepage: https://github.com/ZenifyAIContactCenter/zenify-kit
    description: Portable zenify workspace toolkit
    skip_upload: auto
scoops:
  - repository:
      owner: ZenifyAIContactCenter
      name: scoop-bucket
    name: zenify
    skip_upload: auto
winget:
  - name: zenify
    publisher: ZenifyAIContactCenter
    license: proprietary
    short_description: Portable zenify workspace toolkit
    homepage: https://github.com/ZenifyAIContactCenter/zenify-kit
    repository:
      owner: ZenifyAIContactCenter
      name: winget-pkgs-fork
    skip_upload: auto

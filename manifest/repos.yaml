# Repo manifest (FR-068) — desired set of repos zenify onboarding may wire.
# Versioned in the kit; adding a repo is one commit, teammates re-run to pick up the delta.
# `path` is relative to the workspace root (team layout: `repos/<name>`, see `zenify migrate`) and overridable per-dev via a local overlay.
org: ZenifyAIContactCenter
# Env keys the kit scaffolds into each repo's .claude/settings.local.json as
# EMPTY placeholders (FR-065). Only the key NAMES are versioned here — a secret
# VALUE is never stored, distributed, or read by the kit (FR-041). A developer
# fills the values locally; an existing settings file keeps its values and only
# gains the keys it is missing. Each key carries description/howTo/scope/secret
# metadata (still no values).
secretKeys:
  - name: MONGO_URL
    description: "Chuỗi kết nối MongoDB staging, dùng cho db-read và script dev"
    howTo: "Hỏi trưởng nhóm DevOps (kênh #devops); chuỗi này cấp theo từng người hoặc dùng chung của team"
    scope: shared
  - name: MYSQL_HOST
    description: "Host MySQL của contact-center, dùng cho db-read"
    howTo: "Hỏi trưởng nhóm DevOps; thường là địa chỉ máy chủ DB nội bộ"
    scope: shared
    secret: false
  - name: MYSQL_PORT
    description: "Cổng MySQL của contact-center"
    howTo: "Hỏi trưởng nhóm DevOps; thường là 3306"
    scope: shared
    secret: false
  - name: MYSQL_USER
    description: "Tài khoản MySQL chỉ đọc cho db-read"
    howTo: "Hỏi trưởng nhóm DevOps để được cấp tài khoản chỉ đọc"
    scope: shared
  - name: MYSQL_PASSWORD
    description: "Mật khẩu của tài khoản MySQL chỉ đọc"
    howTo: "Trưởng nhóm DevOps gửi riêng khi cấp tài khoản MYSQL_USER"
    scope: shared
  - name: MYSQL_DATABASE
    description: "Tên database MySQL của contact-center"
    howTo: "Hỏi trưởng nhóm DevOps hoặc xem cấu hình dev của contact-center-be"
    scope: shared
    secret: false
  - name: E2E_DOMAIN
    description: "Tên miền (tenant) dùng để đăng nhập khi chạy E2E"
    howTo: "Dùng tenant dev do QC hoặc trưởng nhóm cấp"
    scope: shared
    secret: false
  - name: E2E_EMAIL
    description: "Email tài khoản dùng đăng nhập khi chạy E2E"
    howTo: "Tài khoản test của chính bạn trên tenant dev; nhờ QC tạo nếu chưa có"
    scope: personal
  - name: E2E_PASSWORD
    description: "Mật khẩu của tài khoản E2E"
    howTo: "Mật khẩu tài khoản test của chính bạn; đặt khi QC tạo tài khoản"
    scope: personal
  - name: POSTHOG_API_KEY
    description: "Khoá API PostHog cá nhân để đọc analytics"
    howTo: "Tự tạo trong PostHog (Settings > Personal API keys) bằng tài khoản của bạn"
    scope: personal
repos:
  - name: contact-center-be
    url: git@github.com:ZenifyAIContactCenter/contact-center-be.git
    path: repos/contact-center-be
    base: origin/staging
    tags: [primary, backend]
  - name: contact-center-web
    url: git@github.com:ZenifyAIContactCenter/contact-center-web.git
    path: repos/contact-center-web
    base: origin/staging
    tags: [primary, frontend]
  - name: contact-center-hub
    url: git@github.com:ZenifyAIContactCenter/contact-center-hub.git
    path: repos/contact-center-hub
    base: origin/staging
    tags: [primary, backend]
  - name: chatting
    url: git@github.com:ZenifyAIContactCenter/chatting.git
    path: repos/chatting
    base: origin/staging
    tags: [primary, realtime]
  - name: notification
    url: git@github.com:ZenifyAIContactCenter/notification.git
    path: repos/notification
    base: origin/staging
    tags: [realtime]
  - name: change-stream-subscriber
    url: git@github.com:ZenifyAIContactCenter/change-stream-subscriber.git
    path: repos/change-stream-subscriber
    base: origin/staging
    tags: [infra, realtime]
  - name: lumi-agent
    url: git@github.com:ZenifyAIContactCenter/lumi-agent.git
    path: repos/lumi-agent
    base: origin/staging
    tags: [ai]
    # Repo-scoped: only a developer who clones lumi-agent gets these placeholders.
    secretKeys:
      - name: LUMI_MYSQL_URL_STG
        description: "URL MySQL của lumi-agent trên staging"
        howTo: "Hỏi trưởng nhóm DevOps hoặc người phụ trách lumi-agent"
        scope: shared
      - name: LUMI_MYSQL_URL_PRD
        description: "URL MySQL của lumi-agent trên production (chỉ đọc)"
        howTo: "Hỏi trưởng nhóm DevOps; chỉ cấp khi cần điều tra production"
        scope: shared
      - name: QDRANT_URL_STG
        description: "URL Qdrant của lumi-agent trên staging"
        howTo: "Hỏi trưởng nhóm DevOps hoặc người phụ trách lumi-agent"
        scope: shared
      - name: QDRANT_URL_PRD
        description: "URL Qdrant của lumi-agent trên production"
        howTo: "Hỏi trưởng nhóm DevOps; chỉ cấp khi cần điều tra production"
        scope: shared
      - name: LUMI_APP_URL_STG
        description: "URL ứng dụng lumi-agent trên staging"
        howTo: "Hỏi người phụ trách lumi-agent"
        scope: shared
        secret: false
      - name: OPENROUTER_API_KEY
        description: "Khoá API OpenRouter để chạy lumi-agent cục bộ"
        howTo: "Tự tạo tại openrouter.ai bằng tài khoản của bạn, hoặc xin hạn mức từ trưởng nhóm AI"
        scope: personal
  - name: message-hub-be
    url: git@github.com:ZenifyAIContactCenter/message-hub-be.git
    path: repos/message-hub-be
    base: origin/staging
    tags: [backend, comm-hub]
  - name: message-hub-web
    url: git@github.com:ZenifyAIContactCenter/message-hub-web.git
    path: repos/message-hub-web
    base: origin/staging
    tags: [frontend, comm-hub]
  - name: ott-gateway
    url: git@github.com:ZenifyAIContactCenter/ott-gateway.git
    path: repos/ott-gateway
    base: origin/staging
    tags: [backend, gateway]
  - name: personal-zalo-gateway
    url: git@github.com:ZenifyAIContactCenter/personal-zalo-gateway.git
    path: repos/personal-zalo-gateway
    base: origin/staging
    tags: [backend, gateway]

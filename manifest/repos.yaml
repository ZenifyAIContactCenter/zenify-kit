# Repo manifest (FR-068) — desired set of repos zenify onboarding may wire.
# Versioned in the kit; adding a repo is one commit, teammates re-run to pick up the delta.
# `path` is relative to the workspace root and overridable per-dev via a local overlay.
org: ZenifyAIContactCenter
# Env keys the kit scaffolds into each repo's .claude/settings.local.json as
# EMPTY placeholders (FR-065). Only the key NAMES are versioned here — a secret
# VALUE is never stored, distributed, or read by the kit (FR-041). A developer
# fills the values locally; an existing settings file keeps its values and only
# gains the keys it is missing.
secretKeys:
  - MONGO_URL
  - MYSQL_HOST
  - MYSQL_PORT
  - MYSQL_USER
  - MYSQL_PASSWORD
  - MYSQL_DATABASE
  - E2E_DOMAIN
  - E2E_EMAIL
  - E2E_PASSWORD
  - POSTHOG_API_KEY
repos:
  - name: contact-center-be
    url: git@github.com:ZenifyAIContactCenter/contact-center-be.git
    path: contact-center-be
    base: origin/staging
    tags: [primary, backend]
  - name: contact-center-web
    url: git@github.com:ZenifyAIContactCenter/contact-center-web.git
    path: contact-center-web
    base: origin/staging
    tags: [primary, frontend]
  - name: contact-center-hub
    url: git@github.com:ZenifyAIContactCenter/contact-center-hub.git
    path: contact-center-hub
    base: origin/staging
    tags: [primary, backend]
  - name: chatting
    url: git@github.com:ZenifyAIContactCenter/chatting.git
    path: chatting
    base: origin/staging
    tags: [primary, realtime]
  - name: notification
    url: git@github.com:ZenifyAIContactCenter/notification.git
    path: notification
    base: origin/staging
    tags: [realtime]
  - name: change-stream-subscriber
    url: git@github.com:ZenifyAIContactCenter/change-stream-subscriber.git
    path: change-stream-subscriber
    base: origin/staging
    tags: [infra, realtime]
  - name: lumi-agent
    url: git@github.com:ZenifyAIContactCenter/lumi-agent.git
    path: lumi-agent
    base: origin/staging
    tags: [ai]
  - name: notification-hub-be
    url: git@github.com:ZenifyAIContactCenter/notification-hub-be.git
    path: notification-hub-be
    base: origin/staging
    tags: [backend, comm-hub]
  - name: notification-hub-web
    url: git@github.com:ZenifyAIContactCenter/notification-hub-web.git
    path: notification-hub-web
    base: origin/staging
    tags: [frontend, comm-hub]
  - name: ott-gateway
    url: git@github.com:ZenifyAIContactCenter/ott-gateway.git
    path: ott-gateway
    base: origin/staging
    tags: [backend, gateway]
  - name: personal-zalo-gateway
    url: git@github.com:ZenifyAIContactCenter/personal-zalo-gateway.git
    path: personal-zalo-gateway
    base: origin/staging
    tags: [backend, gateway]

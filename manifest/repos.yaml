# Repo manifest (FR-068) — desired set of repos zenify onboarding may wire.
# Versioned in the kit; adding a repo is one commit, teammates re-run to pick up the delta.
# `path` is relative to the workspace root (team layout: `repos/<name>`, see `zenify migrate`) and overridable per-dev via a local overlay.
org: ZenifyAIContactCenter
# Credential broker (zenify-broker): db-read, redis-read, e2e and the grafana/posthog MCPs
# fetch short-lived credentials from it with the developer's GitHub token, so the
# DB, E2E and PostHog keys no longer live in .zenify/.env. Only the URL is versioned.
broker:
  url: https://broker.zenify.vn
repos:
  - name: contact-center-be
    url: git@github.com:ZenifyAIContactCenter/contact-center-be.git
    path: repos/contact-center-be
    base: origin/staging
    tags: [primary, backend]
  - name: contact-center-web
    url: git@github.com:ZenifyAIContactCenter/contact-center-web.git
    path: repos/contact-center-web
    base: origin/staging
    tags: [primary, frontend]
  - name: contact-center-hub
    url: git@github.com:ZenifyAIContactCenter/contact-center-hub.git
    path: repos/contact-center-hub
    base: origin/staging
    tags: [primary, backend]
  - name: chatting
    url: git@github.com:ZenifyAIContactCenter/chatting.git
    path: repos/chatting
    base: origin/staging
    tags: [primary, realtime]
  - name: notification
    url: git@github.com:ZenifyAIContactCenter/notification.git
    path: repos/notification
    base: origin/staging
    tags: [realtime]
  - name: change-stream-subscriber
    url: git@github.com:ZenifyAIContactCenter/change-stream-subscriber.git
    path: repos/change-stream-subscriber
    base: origin/staging
    tags: [infra, realtime]
  - name: lumi-agent
    url: git@github.com:ZenifyAIContactCenter/lumi-agent.git
    path: repos/lumi-agent
    base: origin/staging
    tags: [ai]
  - name: message-hub-be
    url: git@github.com:ZenifyAIContactCenter/message-hub-be.git
    path: repos/message-hub-be
    base: origin/staging
    tags: [backend, comm-hub]
  - name: message-hub-web
    url: git@github.com:ZenifyAIContactCenter/message-hub-web.git
    path: repos/message-hub-web
    base: origin/staging
    tags: [frontend, comm-hub]
  - name: ott-gateway
    url: git@github.com:ZenifyAIContactCenter/ott-gateway.git
    path: repos/ott-gateway
    base: origin/staging
    tags: [backend, gateway]
  - name: personal-zalo-gateway
    url: git@github.com:ZenifyAIContactCenter/personal-zalo-gateway.git
    path: repos/personal-zalo-gateway
    base: origin/staging
    tags: [backend, gateway]

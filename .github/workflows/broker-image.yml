name: broker-image
# Publishes ghcr.io/zenifyaicontactcenter/zenify-broker:main-<sha> from main, so
# the broker host can be built and checked (FR-13.4) before the release tag
# that switches every dev onto the broker. Release images still come from
# release.yml (GoReleaser) on a tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cmd/zenify-broker/**
      - internal/broker/**
      - internal/dbread/**
      - .github/workflows/broker-image.yml
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: v
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Same context layout GoReleaser builds: linux/amd64/zenify-broker.
      - run: |
          mkdir -p "$RUNNER_TEMP/ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/ZenifyAIContactCenter/zenify-kit/internal/version.Version=${{ steps.v.outputs.tag }}" \
            -o "$RUNNER_TEMP/ctx/linux/amd64/zenify-broker" ./cmd/zenify-broker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/ctx
          file: cmd/zenify-broker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/zenifyaicontactcenter/zenify-broker:${{ steps.v.outputs.tag }}
            ghcr.io/zenifyaicontactcenter/zenify-broker:main

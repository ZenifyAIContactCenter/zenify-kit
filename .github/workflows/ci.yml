name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: secret-scan (self)
        run: go run ./cmd/zenify secret-scan .
      - name: cross-compile smoke (all 6 targets build)
        run: |
          for goos in darwin linux windows; do
            for goarch in amd64 arm64; do
              GOOS=$goos GOARCH=$goarch go build -o /dev/null ./cmd/zenify
            done
          done
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          install-only: true
      - run: goreleaser release --snapshot --clean --skip=publish

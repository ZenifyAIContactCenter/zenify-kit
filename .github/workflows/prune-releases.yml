name: prune-releases
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: List what would be deleted without deleting anything
permissions:
  contents: write
concurrency:
  group: prune-releases
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      KEEP: '10'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: delete releases and tags beyond the newest KEEP
        run: |
          set -euo pipefail
          tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | sort -rV)
          echo "Keeping:"; echo "$tags" | head -n "$KEEP"
          prune=$(echo "$tags" | tail -n +"$((KEEP + 1))")
          if [ -z "$prune" ]; then echo "Nothing to prune"; exit 0; fi
          echo "Pruning $(echo "$prune" | wc -l) release(s):"
          while IFS= read -r tag; do
            if [ "$DRY_RUN" = "true" ]; then echo "[dry-run] would delete $tag"
            else echo "Deleting $tag"; gh release delete "$tag" --cleanup-tag --yes; fi
          done <<< "$prune"

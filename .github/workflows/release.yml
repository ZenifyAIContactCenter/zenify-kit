name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
  pull-requests: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The App key lives only in this environment, which deploys from v* tags only.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: changelog entry exists for this tag
        run: |
          f=website/changelog.md
          grep -qx "## ${GITHUB_REF_NAME}" "$f" || { echo "::error::$f has no '## ${GITHUB_REF_NAME}' section — write it before tagging"; exit 1; }
          awk -v tag="## ${GITHUB_REF_NAME}" '$0==tag{on=1;next} /^## /{on=0} on' "$f" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The org forbids GITHUB_TOKEN from opening PRs; the tap PR uses an App
      # token scoped to this repo (the default) and to contents + pull-requests.
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
      - name: auto-merge the cask/scoop PR once Zenie Review passes
        run: gh pr merge "chore/tap-${GITHUB_REF_NAME}" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
